name: Refresh authentic UI screenshots

on:
  push:
    branches:
      - main
      - 'v*'
    paths-ignore:
      - 'assets/readme/ghostftp-client.png'
      - 'assets/readme/ghostftp-site-manager.png'

permissions:
  contents: write

concurrency:
  group: ghostftp-ui-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  capture-real-wpf-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GhostFTP.sln

      - name: Build real Ghost FTP client
        run: dotnet build GhostFTP.sln -c Release --no-restore

      - name: Capture production WPF client and Site Manager
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/readme | Out-Null
          dotnet run --project src/GhostFTP.App/GhostFTP.App.csproj -c Release --no-build -- --capture-ui "$PWD/assets/readme"

          foreach ($name in @('assets/readme/ghostftp-client.png', 'assets/readme/ghostftp-site-manager.png')) {
            if (!(Test-Path $name -PathType Leaf)) {
              throw "Authentic Ghost FTP UI screenshot was not created: $name"
            }
            if ((Get-Item $name).Length -lt 10000) {
              throw "Authentic Ghost FTP UI screenshot is unexpectedly small: $name"
            }
          }

      - name: Commit authentic screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/ghostftp-client.png assets/readme/ghostftp-site-manager.png
          if (git diff --cached --quiet) {
            Write-Host "Authentic Ghost FTP screenshots are already current."
            exit 0
          }
          git commit -m "Refresh authentic Ghost FTP UI screenshots"
          git push origin HEAD:${{ github.ref_name }}
