name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-*'

permissions:
  contents: write

concurrency:
  group: ghostftp-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release version, channel and notes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $channel = (Get-Content RELEASE_CHANNEL -Raw).Trim().ToLowerInvariant()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use MAJOR.MINOR.PATCH format. Got: $version"
          }
          if ($channel -notin @('beta', 'stable')) {
            throw "RELEASE_CHANNEL must be beta or stable. Got: $channel"
          }

          $major = [int]($version.Split('.')[0])
          if ($major -eq 0 -and $channel -ne 'beta') {
            throw 'All Ghost FTP 0.x releases must remain Beta.'
          }

          $expectedTag = if ($channel -eq 'beta') { "v$version-beta" } else { "v$version" }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne $expectedTag) {
              throw "Tag $tag does not match expected $channel tag $expectedTag."
            }
          }

          $notes = "docs/releases/v$version.md"
          if (!(Test-Path $notes -PathType Leaf) -or (Get-Item $notes).Length -le 0) {
            throw "Required release notes are missing or empty: $notes"
          }

          $releaseNotes = Get-Content $notes -Raw
          if ($releaseNotes -notmatch [regex]::Escape("Ghost FTP $version")) {
            throw "$notes must identify Ghost FTP $version."
          }
          if ($channel -eq 'beta' -and $releaseNotes -notmatch '(?i)beta') {
            throw "$notes must identify the release as Beta."
          }

          "GHOSTFTP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GHOSTFTP_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GHOSTFTP_TAG=$expectedTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GHOSTFTP_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore release sources and live-smoke compile target
        shell: pwsh
        run: |
          dotnet restore GhostFTP.sln
          dotnet restore tests/GhostFTP.LiveSmoke/GhostFTP.LiveSmoke.csproj

      - name: Build release sources and live-smoke compile target
        shell: pwsh
        run: |
          dotnet build GhostFTP.sln -c Release --no-restore
          dotnet build tests/GhostFTP.LiveSmoke/GhostFTP.LiveSmoke.csproj -c Release --no-restore

      - name: Dependency, version, channel, privacy, platform and signing audit
        shell: pwsh
        run: ./audit-source.ps1

      - name: Final security release-contract audit
        shell: pwsh
        run: ./audit-hardening.ps1

      - name: Core self-test
        run: dotnet run --project tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj -c Release --no-build

      - name: Parallel transfer queue self-test
        run: dotnet run --project tests/GhostFTP.QueueSelfTest/GhostFTP.QueueSelfTest.csproj -c Release --no-build

      - name: Protocol and shutdown hardening self-test
        run: dotnet run --project tests/GhostFTP.HardeningSelfTest/GhostFTP.HardeningSelfTest.csproj -c Release --no-build

      - name: WPF editable input and localization smoke-test
        run: dotnet run --project tests/GhostFTP.UiSmoke/GhostFTP.UiSmoke.csproj -c Release --no-build

      - name: Capture authentic production UI
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts/ui'
          New-Item -ItemType Directory -Force $output | Out-Null
          dotnet run --project src/GhostFTP.App/GhostFTP.App.csproj -c Release --no-build -- --capture-ui $output

          foreach ($name in @('ghostftp-client.png', 'ghostftp-site-manager.png')) {
            $path = Join-Path $output $name
            if (!(Test-Path $path -PathType Leaf)) {
              throw "Required authentic UI capture is missing: $path"
            }
            if ((Get-Item $path).Length -lt 10000) {
              throw "Required authentic UI capture is unexpectedly small: $path"
            }
          }

          Add-Type -AssemblyName PresentationCore
          $client = Join-Path $output 'ghostftp-client.png'
          $stream = [System.IO.File]::OpenRead($client)
          try {
            $decoder = [System.Windows.Media.Imaging.PngBitmapDecoder]::new(
              $stream,
              [System.Windows.Media.Imaging.BitmapCreateOptions]::PreservePixelFormat,
              [System.Windows.Media.Imaging.BitmapCacheOption]::OnLoad)
            $frame = $decoder.Frames[0]
            if ($frame.PixelWidth -ne 1914 -or $frame.PixelHeight -ne 907) {
              throw "Authentic MainWindow capture must be 1914x907 but was $($frame.PixelWidth)x$($frame.PixelHeight)."
            }
          }
          finally {
            $stream.Dispose()
          }

      - name: Upload authentic release UI captures
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-${{ env.GHOSTFTP_VERSION }}-${{ env.GHOSTFTP_CHANNEL }}-Authentic-Windows-UI
          path: artifacts/ui/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Build Windows release packages
        shell: pwsh
        run: ./build-release.ps1

      - name: Authenticode-sign Windows release binaries
        shell: pwsh
        env:
          GHOSTFTP_SIGNING_PFX_BASE64: ${{ secrets.GHOSTFTP_SIGNING_PFX_BASE64 }}
          GHOSTFTP_SIGNING_PFX_PASSWORD: ${{ secrets.GHOSTFTP_SIGNING_PFX_PASSWORD }}
          GHOSTFTP_TIMESTAMP_URL: ${{ secrets.GHOSTFTP_TIMESTAMP_URL }}
        run: |
          $requireTrusted = $env:GHOSTFTP_CHANNEL -eq 'stable'
          ./tools/Sign-WindowsRelease.ps1 -ReleaseDirectory ./release -RequireTrustedSignature:$requireTrusted

          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add("Ghost FTP $env:GHOSTFTP_VERSION $env:GHOSTFTP_CHANNEL signing report")
          $report.Add("Generated: $([DateTimeOffset]::UtcNow.ToString('u'))")
          $report.Add('')

          foreach ($exe in Get-ChildItem ./release -Filter '*.exe' -File | Sort-Object Name) {
            $signature = Get-AuthenticodeSignature $exe.FullName
            if ($null -eq $signature.SignerCertificate) {
              $report.Add("$($exe.Name): UNSIGNED")
            }
            else {
              $report.Add("$($exe.Name): $($signature.Status) | $($signature.SignerCertificate.Subject) | $($signature.SignerCertificate.Thumbprint)")
            }
          }
          $report | Set-Content ./release/SIGNING.txt -Encoding utf8

      - name: Verify required Windows GitHub Release assets
        shell: pwsh
        run: |
          $required = @(
            'release/portable.exe',
            'release/setup.exe',
            'release/portable-arm64.exe',
            'release/setup-arm64.exe',
            'release/GhostFTP-Portable-win-x64.exe',
            'release/GhostFTP-Setup-win-x64.exe',
            'release/GhostFTP-Portable-win-arm64.exe',
            'release/GhostFTP-Setup-win-arm64.exe',
            'release/SHA256SUMS.txt',
            'release/SIGNING.txt'
          )

          foreach ($path in $required) {
            if (!(Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) {
              throw "Required GitHub Release asset is missing or empty: $path"
            }
          }

          $expectedFileVersion = "$env:GHOSTFTP_VERSION.0"
          foreach ($exe in $required | Where-Object { $_ -like '*.exe' }) {
            $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
            if ($versionInfo.FileVersion -ne $expectedFileVersion) {
              throw "$exe has FileVersion '$($versionInfo.FileVersion)' but expected '$expectedFileVersion'."
            }
            if ($versionInfo.ProductName -ne 'Ghost FTP') {
              throw "$exe does not identify ProductName Ghost FTP."
            }
            if ($versionInfo.CompanyName -ne 'BRENDIGO LTD') {
              throw "$exe does not identify CompanyName BRENDIGO LTD."
            }
          }

          $hashLines = Get-Content 'release/SHA256SUMS.txt'
          foreach ($exe in $required | Where-Object { $_ -like '*.exe' }) {
            $name = Split-Path $exe -Leaf
            $expectedHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not ($hashLines -match ('^' + [regex]::Escape($expectedHash) + '\s+' + [regex]::Escape($name) + '$'))) {
              throw "SHA256SUMS.txt does not match final bytes for $name"
            }
          }

          if ($env:GHOSTFTP_CHANNEL -eq 'stable') {
            foreach ($exe in $required | Where-Object { $_ -like '*.exe' }) {
              $signature = Get-AuthenticodeSignature $exe
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
                throw "Stable release executable is not trusted-signed: $exe ($($signature.Status))"
              }
            }
          }

      - name: Upload verified Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Windows-${{ env.GHOSTFTP_VERSION }}-${{ env.GHOSTFTP_CHANNEL }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or synchronize GitHub release with Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GHOSTFTP_VERSION
          $channel = $env:GHOSTFTP_CHANNEL
          $notes = $env:GHOSTFTP_NOTES
          $tag = $env:GHOSTFTP_TAG
          $title = if ($channel -eq 'beta') { "Ghost FTP $version Beta" } else { "Ghost FTP $version" }
          $assets = @(
            'release/setup.exe',
            'release/portable.exe',
            'release/setup-arm64.exe',
            'release/portable-arm64.exe',
            'release/GhostFTP-Setup-win-x64.exe',
            'release/GhostFTP-Portable-win-x64.exe',
            'release/GhostFTP-Setup-win-arm64.exe',
            'release/GhostFTP-Portable-win-arm64.exe',
            'release/SHA256SUMS.txt',
            'release/SIGNING.txt'
          )

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; synchronizing detailed notes and verified Windows assets."
            if ($channel -eq 'beta') {
              gh release edit $tag --title $title --notes-file $notes --prerelease
            }
            else {
              gh release edit $tag --title $title --notes-file $notes
            }
            if ($LASTEXITCODE -ne 0) { throw "Failed to update GitHub Release notes for $tag." }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh Windows GitHub Release assets for $tag." }
          }
          else {
            if ($channel -eq 'beta') {
              gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes-file $notes --prerelease
            }
            else {
              gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes-file $notes
            }
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag." }
          }

  linux-release:
    needs: windows-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate Linux release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          channel="$(tr '[:upper:]' '[:lower:]' < RELEASE_CHANNEL | tr -d '\r\n ')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
          [[ "$channel" == "beta" || "$channel" == "stable" ]] || { echo "Invalid RELEASE_CHANNEL: $channel" >&2; exit 1; }
          if [[ "${version%%.*}" == "0" && "$channel" != "beta" ]]; then
            echo 'Every Ghost FTP 0.x releases must remain Beta.' >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$channel" == "beta" ]]; then tag="$tag-beta"; fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match expected $tag." >&2
            exit 1
          fi
          echo "GHOSTFTP_VERSION=$version" >> "$GITHUB_ENV"
          echo "GHOSTFTP_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "GHOSTFTP_TAG=$tag" >> "$GITHUB_ENV"

      - name: Restore Linux renderer and shared compile/test targets
        shell: bash
        run: |
          dotnet restore src/GhostFTP.Linux/GhostFTP.Linux.csproj
          dotnet restore tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj
          dotnet restore tests/GhostFTP.QueueSelfTest/GhostFTP.QueueSelfTest.csproj
          dotnet restore tests/GhostFTP.HardeningSelfTest/GhostFTP.HardeningSelfTest.csproj
          dotnet restore tests/GhostFTP.LiveSmoke/GhostFTP.LiveSmoke.csproj

      - name: Build Linux desktop client and test harnesses
        shell: bash
        run: |
          dotnet build src/GhostFTP.Linux/GhostFTP.Linux.csproj -c Release --no-restore
          dotnet build tests/GhostFTP.HardeningSelfTest/GhostFTP.HardeningSelfTest.csproj -c Release --no-restore
          dotnet build tests/GhostFTP.LiveSmoke/GhostFTP.LiveSmoke.csproj -c Release --no-restore

      - name: Smoke-test real Linux X11/XWayland renderer
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || { echo 'xvfb-run is required for the Linux release UI gate.' >&2; exit 1; }
          xvfb-run -a timeout 15s dotnet run --project src/GhostFTP.Linux/GhostFTP.Linux.csproj -c Release --no-build -- --smoke-test

      - name: Core self-test on Linux
        run: dotnet run --project tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj -c Release --no-restore

      - name: Parallel transfer queue self-test on Linux
        run: dotnet run --project tests/GhostFTP.QueueSelfTest/GhostFTP.QueueSelfTest.csproj -c Release --no-restore

      - name: Protocol and shutdown hardening self-test on Linux
        run: dotnet run --project tests/GhostFTP.HardeningSelfTest/GhostFTP.HardeningSelfTest.csproj -c Release --no-build

      - name: Cross-platform release source audit
        shell: pwsh
        run: ./audit-source.ps1

      - name: Final security release-contract audit
        shell: pwsh
        run: ./audit-hardening.ps1

      - name: Build Linux x64 and ARM64 release packages
        shell: bash
        run: |
          chmod +x ./build-linux-release.sh
          ./build-linux-release.sh

      - name: Verify Linux packages, final SHA-256 manifest and packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          required=(
            release-linux/GhostFTP-linux-x64
            release-linux/GhostFTP-linux-arm64
            release-linux/GhostFTP-linux-x64.tar.gz
            release-linux/GhostFTP-linux-arm64.tar.gz
            release-linux/GhostFTP-${GHOSTFTP_VERSION}-${GHOSTFTP_CHANNEL}-linux-x64.tar.gz
            release-linux/GhostFTP-${GHOSTFTP_VERSION}-${GHOSTFTP_CHANNEL}-linux-arm64.tar.gz
            release-linux/SHA256SUMS-linux.txt
            release-linux/BUILD-INFO.txt
          )
          for path in "${required[@]}"; do
            [[ -s "$path" ]] || { echo "Missing/empty Linux release asset: $path" >&2; exit 1; }
          done
          [[ -x release-linux/GhostFTP-linux-x64 ]] || { echo 'linux-x64 binary is not executable.' >&2; exit 1; }
          [[ -x release-linux/GhostFTP-linux-arm64 ]] || { echo 'linux-arm64 binary is not executable.' >&2; exit 1; }
          (cd release-linux && sha256sum -c SHA256SUMS-linux.txt)
          file release-linux/GhostFTP-linux-x64
          file release-linux/GhostFTP-linux-arm64
          xvfb-run -a timeout 15s release-linux/GhostFTP-linux-x64 --smoke-test

      - name: Upload verified Linux release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Linux-${{ env.GHOSTFTP_VERSION }}-${{ env.GHOSTFTP_CHANNEL }}
          path: release-linux/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach verified Linux assets to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GHOSTFTP_TAG" >/dev/null
          gh release upload "$GHOSTFTP_TAG" \
            release-linux/GhostFTP-linux-x64 \
            release-linux/GhostFTP-linux-arm64 \
            release-linux/GhostFTP-linux-x64.tar.gz \
            release-linux/GhostFTP-linux-arm64.tar.gz \
            "release-linux/GhostFTP-${GHOSTFTP_VERSION}-${GHOSTFTP_CHANNEL}-linux-x64.tar.gz" \
            "release-linux/GhostFTP-${GHOSTFTP_VERSION}-${GHOSTFTP_CHANNEL}-linux-arm64.tar.gz" \
            release-linux/SHA256SUMS-linux.txt \
            release-linux/BUILD-INFO.txt \
            --clobber
