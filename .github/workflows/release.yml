name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger-*'

permissions:
  contents: write

concurrency:
  group: ghostftp-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "v$version") { throw "Tag $tag does not match VERSION v$version." }
          }
      - name: Restore
        run: dotnet restore GhostFTP.sln
      - name: Build
        run: dotnet build GhostFTP.sln -c Release --no-restore
      - name: Dependency, version, privacy and brand audit
        shell: pwsh
        run: ./audit-source.ps1
      - name: Self-test
        run: dotnet run --project tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj -c Release --no-build
      - name: Build release packages
        shell: pwsh
        run: ./build-release.ps1
      - name: Verify required GitHub Release assets
        shell: pwsh
        run: |
          $required = @(
            'release/portable.exe',
            'release/setup.exe',
            'release/portable-arm64.exe',
            'release/setup-arm64.exe',
            'release/GhostFTP-Portable-win-x64.exe',
            'release/GhostFTP-Setup-win-x64.exe',
            'release/GhostFTP-Portable-win-arm64.exe',
            'release/GhostFTP-Setup-win-arm64.exe',
            'release/SHA256SUMS.txt'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) {
              throw "Required GitHub Release asset is missing or empty: $path"
            }
          }
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-release
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$version" }
          $assets = @(
            'release/setup.exe',
            'release/portable.exe',
            'release/setup-arm64.exe',
            'release/portable-arm64.exe',
            'release/GhostFTP-Setup-win-x64.exe',
            'release/GhostFTP-Portable-win-x64.exe',
            'release/GhostFTP-Setup-win-arm64.exe',
            'release/GhostFTP-Portable-win-arm64.exe',
            'release/SHA256SUMS.txt'
          )

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; refreshing verified assets."
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh GitHub Release assets for $tag." }
          }
          else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "Ghost FTP $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag." }
          }
