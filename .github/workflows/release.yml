name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "v$version") { throw "Tag $tag does not match VERSION v$version." }
          }
      - name: Restore
        run: dotnet restore GhostFTP.sln
      - name: Build
        run: dotnet build GhostFTP.sln -c Release --no-restore
      - name: Dependency and telemetry audit
        shell: pwsh
        run: ./audit-source.ps1
      - name: Self-test
        run: dotnet run --project tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj -c Release --no-build
      - name: Build release packages
        shell: pwsh
        run: ./build-release.ps1
      - name: Verify required GitHub Release assets
        shell: pwsh
        run: |
          $required = @(
            'release/portable.exe',
            'release/setup.exe',
            'release/portable-arm64.exe',
            'release/setup-arm64.exe',
            'release/GhostFTP-Portable-win-x64.exe',
            'release/GhostFTP-Setup-win-x64.exe',
            'release/GhostFTP-Portable-win-arm64.exe',
            'release/GhostFTP-Setup-win-arm64.exe',
            'release/SHA256SUMS.txt'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) {
              throw "Required GitHub Release asset is missing or empty: $path"
            }
          }
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-release
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            release/setup.exe `
            release/portable.exe `
            release/setup-arm64.exe `
            release/portable-arm64.exe `
            release/GhostFTP-Setup-win-x64.exe `
            release/GhostFTP-Portable-win-x64.exe `
            release/GhostFTP-Setup-win-arm64.exe `
            release/GhostFTP-Portable-win-arm64.exe `
            release/SHA256SUMS.txt `
            --title "GhostFTP ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
