name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  build-self-test-release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GhostFTP.sln
      - name: Build
        run: dotnet build GhostFTP.sln -c Release --no-restore
      - name: Dependency, version and telemetry audit
        shell: pwsh
        run: ./audit-source.ps1
      - name: Self-test
        run: dotnet run --project tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj -c Release --no-build
      - name: Build portable and setup packages
        if: github.event_name == 'push'
        shell: pwsh
        run: ./build-release.ps1
      - name: Upload verified Windows packages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-1.1.0-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
