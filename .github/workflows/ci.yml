name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghostftp-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  windows-build-self-test-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Load version and release channel
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $channel = (Get-Content RELEASE_CHANNEL -Raw).Trim().ToLowerInvariant()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($channel -notin @('beta','stable')) { throw "Invalid RELEASE_CHANNEL: $channel" }
          if ([int]($version.Split('.')[0]) -eq 0 -and $channel -ne 'beta') {
            throw 'Every Ghost FTP 0.x build must remain Beta.'
          }
          "GHOSTFTP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GHOSTFTP_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore GhostFTP.sln
          dotnet restore tests/GhostFTP.LiveSmoke/GhostFTP.LiveSmoke.csproj

      - name: Build Windows solution plus Linux compile target
        shell: pwsh
        run: |
          dotnet build GhostFTP.sln -c Release --no-restore
          dotnet build tests/GhostFTP.LiveSmoke/GhostFTP.LiveSmoke.csproj -c Release --no-restore

      - name: Dependency, version, channel, privacy, platform and signing audit
        shell: pwsh
        run: ./audit-source.ps1

      - name: Final security release-contract audit
        shell: pwsh
        run: ./audit-hardening.ps1

      - name: Core self-test
        run: dotnet run --project tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj -c Release --no-build

      - name: Parallel transfer queue self-test
        run: dotnet run --project tests/GhostFTP.QueueSelfTest/GhostFTP.QueueSelfTest.csproj -c Release --no-build

      - name: WPF editable input and localization smoke-test
        run: dotnet run --project tests/GhostFTP.UiSmoke/GhostFTP.UiSmoke.csproj -c Release --no-build

      - name: Capture authentic production UI
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts/ui'
          New-Item -ItemType Directory -Force $output | Out-Null
          dotnet run --project src/GhostFTP.App/GhostFTP.App.csproj -c Release --no-build -- --capture-ui $output

          foreach ($name in @('ghostftp-client.png', 'ghostftp-site-manager.png')) {
            $path = Join-Path $output $name
            if (!(Test-Path $path -PathType Leaf)) {
              throw "Required authentic UI capture is missing: $path"
            }
            if ((Get-Item $path).Length -lt 10000) {
              throw "Required authentic UI capture is unexpectedly small: $path"
            }
          }

      - name: Upload authentic UI captures
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-${{ env.GHOSTFTP_VERSION }}-${{ env.GHOSTFTP_CHANNEL }}-Authentic-Windows-UI
          path: artifacts/ui/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Build portable and setup packages
        shell: pwsh
        run: ./build-release.ps1

      - name: Verify canonical and architecture-specific executables
        shell: pwsh
        run: |
          $expectedFileVersion = "$env:GHOSTFTP_VERSION.0"
          $required = @(
            'release/portable.exe',
            'release/setup.exe',
            'release/portable-arm64.exe',
            'release/setup-arm64.exe',
            'release/GhostFTP-Portable-win-x64.exe',
            'release/GhostFTP-Setup-win-x64.exe',
            'release/GhostFTP-Portable-win-arm64.exe',
            'release/GhostFTP-Setup-win-arm64.exe'
          )

          foreach ($name in $required) {
            if (!(Test-Path $name -PathType Leaf) -or (Get-Item $name).Length -le 0) {
              throw "Required release executable is missing or empty: $name"
            }
            $actual = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $name)).FileVersion
            if ($actual -ne $expectedFileVersion) {
              throw "$name has FileVersion '$actual' but expected '$expectedFileVersion'."
            }
          }

          if ($env:GHOSTFTP_CHANNEL -eq 'stable' -and $env:GHOSTFTP_VERSION -eq '1.0.0') {
            Write-Host 'Stable 1.0.0 Windows package family verified.'
          }
          else {
            Write-Host "Verified Ghost FTP $env:GHOSTFTP_VERSION $env:GHOSTFTP_CHANNEL Windows package family."
          }

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Windows-${{ env.GHOSTFTP_VERSION }}-${{ env.GHOSTFTP_CHANNEL }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  linux-build-self-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Load version and release channel
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          channel="$(tr '[:upper:]' '[:lower:]' < RELEASE_CHANNEL | tr -d '\r\n ')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
          [[ "$channel" == "beta" || "$channel" == "stable" ]] || { echo "Invalid RELEASE_CHANNEL: $channel" >&2; exit 1; }
          if [[ "${version%%.*}" == "0" && "$channel" != "beta" ]]; then
            echo 'Every Ghost FTP 0.x build must remain Beta.' >&2
            exit 1
          fi
          echo "GHOSTFTP_VERSION=$version" >> "$GITHUB_ENV"
          echo "GHOSTFTP_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Restore Linux renderer and cross-platform tests
        shell: bash
        run: |
          dotnet restore src/GhostFTP.Linux/GhostFTP.Linux.csproj
          dotnet restore tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj
          dotnet restore tests/GhostFTP.QueueSelfTest/GhostFTP.QueueSelfTest.csproj
          dotnet restore tests/GhostFTP.LiveSmoke/GhostFTP.LiveSmoke.csproj

      - name: Build Linux desktop client and live-smoke harness
        shell: bash
        run: |
          dotnet build src/GhostFTP.Linux/GhostFTP.Linux.csproj -c Release --no-restore
          dotnet build tests/GhostFTP.LiveSmoke/GhostFTP.LiveSmoke.csproj -c Release --no-restore

      - name: Smoke-test real Linux X11/XWayland renderer
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || { echo 'xvfb-run is required for the Linux UI quality gate.' >&2; exit 1; }
          xvfb-run -a timeout 15s dotnet run --project src/GhostFTP.Linux/GhostFTP.Linux.csproj -c Release --no-build -- --smoke-test

      - name: Core self-test on Linux
        run: dotnet run --project tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj -c Release --no-restore

      - name: Parallel transfer queue self-test on Linux
        run: dotnet run --project tests/GhostFTP.QueueSelfTest/GhostFTP.QueueSelfTest.csproj -c Release --no-restore

      - name: Cross-platform source audit
        shell: pwsh
        run: ./audit-source.ps1

      - name: Final security release-contract audit
        shell: pwsh
        run: ./audit-hardening.ps1

      - name: Build self-contained Linux x64 and ARM64 packages
        shell: bash
        run: |
          chmod +x ./build-linux-release.sh
          ./build-linux-release.sh

      - name: Verify Linux release assets, checksums and packaged x64 runtime
        shell: bash
        run: |
          set -euo pipefail
          required=(
            release-linux/GhostFTP-linux-x64
            release-linux/GhostFTP-linux-arm64
            release-linux/GhostFTP-linux-x64.tar.gz
            release-linux/GhostFTP-linux-arm64.tar.gz
            release-linux/GhostFTP-${GHOSTFTP_VERSION}-${GHOSTFTP_CHANNEL}-linux-x64.tar.gz
            release-linux/GhostFTP-${GHOSTFTP_VERSION}-${GHOSTFTP_CHANNEL}-linux-arm64.tar.gz
            release-linux/SHA256SUMS-linux.txt
            release-linux/BUILD-INFO.txt
          )
          for path in "${required[@]}"; do
            [[ -s "$path" ]] || { echo "Missing/empty Linux release asset: $path" >&2; exit 1; }
          done
          [[ -x release-linux/GhostFTP-linux-x64 ]] || { echo 'linux-x64 binary is not executable.' >&2; exit 1; }
          [[ -x release-linux/GhostFTP-linux-arm64 ]] || { echo 'linux-arm64 binary is not executable.' >&2; exit 1; }
          (cd release-linux && sha256sum -c SHA256SUMS-linux.txt)
          file release-linux/GhostFTP-linux-x64
          file release-linux/GhostFTP-linux-arm64
          xvfb-run -a timeout 15s release-linux/GhostFTP-linux-x64 --smoke-test

      - name: Upload verified Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Linux-${{ env.GHOSTFTP_VERSION }}-${{ env.GHOSTFTP_CHANNEL }}
          path: release-linux/*
          if-no-files-found: error
          retention-days: 30
