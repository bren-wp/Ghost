<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ghost FTP</title>
  <desc id="desc">Ghost FTP privacy-first FTP and FTPS workspace product artwork.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071126"/>
      <stop offset="0.55" stop-color="#0b1d48"/>
      <stop offset="1" stop-color="#20104d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32d9ff"/>
      <stop offset="0.5" stop-color="#5670ff"/>
      <stop offset="1" stop-color="#a35dff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121c34"/>
      <stop offset="1" stop-color="#0c1427"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#030712" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#background)"/>
  <circle cx="1440" cy="80" r="420" fill="#2746d8" opacity=".18"/>
  <circle cx="1520" cy="760" r="380" fill="#7b39df" opacity=".16"/>
  <path d="M0 730C290 590 480 675 690 825L0 900Z" fill="#114bdd" opacity=".14"/>

  <g transform="translate(80 92)">
    <rect width="128" height="128" rx="30" fill="#0b255a" stroke="#41d7ff" stroke-width="5"/>
    <path d="M24 39h51l16 16h18v18H24z" fill="url(#accent)"/>
    <rect x="18" y="59" width="92" height="54" rx="15" fill="url(#accent)"/>
    <text x="36" y="103" fill="white" font-family="Segoe UI, Arial" font-size="58" font-weight="700">G</text>
    <path d="M90 72l-10 12h7v11h7V84h7z" fill="#52e8ff"/>
    <path d="M90 108l10-12h-7V85h-7v11h-7z" fill="#c173ff"/>
  </g>

  <text x="240" y="142" fill="#f5f7ff" font-family="Segoe UI, Arial" font-size="68" font-weight="700">Ghost</text>
  <text x="430" y="142" fill="url(#accent)" font-family="Segoe UI, Arial" font-size="68" font-weight="700">FTP</text>
  <text x="240" y="185" fill="#aebbd4" font-family="Segoe UI, Arial" font-size="24">Private FTP / FTPS workspace for Windows</text>

  <g filter="url(#shadow)" transform="translate(112 250)">
    <rect width="1376" height="520" rx="28" fill="#0a1120" stroke="#31436b" stroke-width="2"/>
    <rect x="18" y="18" width="250" height="484" rx="22" fill="#0f182a" stroke="#263658"/>
    <text x="46" y="64" fill="#f5f7ff" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Ghost FTP</text>
    <text x="46" y="92" fill="#8293b5" font-family="Segoe UI, Arial" font-size="13">Private workspace</text>
    <text x="46" y="148" fill="#9caed0" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Saved servers</text>
    <rect x="36" y="165" width="214" height="46" rx="12" fill="#192743" stroke="#3a5180"/>
    <circle cx="58" cy="188" r="6" fill="#39d98a"/>
    <text x="74" y="194" fill="#edf2ff" font-family="Segoe UI, Arial" font-size="15">GhostFTP Demo</text>
