    <g transform="translate(286 148)">
      <rect width="516" height="248" rx="20" fill="url(#panel)" stroke="#273a61"/>
      <text x="20" y="36" fill="#f5f7ff" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Local</text>
      <text x="20" y="56" fill="#7f91b4" font-family="Segoe UI, Arial" font-size="12">This PC</text>
      <rect x="20" y="72" width="476" height="34" rx="9" fill="#0d1729" stroke="#30436c"/>
      <rect x="20" y="120" width="104" height="32" rx="9" fill="url(#accent)"/>
      <text x="45" y="141" fill="white" font-family="Segoe UI, Arial" font-size="13" font-weight="700">Upload</text>
      <rect x="20" y="167" width="476" height="1" fill="#2f4168"/>
      <text x="30" y="192" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">Name</text>
      <text x="287" y="192" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">Type</text>
      <text x="375" y="192" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">Size</text>
      <text x="425" y="192" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">Modified</text>
      <text x="30" y="220" fill="#edf2ff" font-family="Segoe UI, Arial" font-size="13">Documents</text>
      <text x="287" y="220" fill="#8ea1c5" font-family="Segoe UI, Arial" font-size="13">Folder</text>
    </g>

    <g transform="translate(820 148)">
      <rect width="538" height="248" rx="20" fill="url(#panel)" stroke="#273a61"/>
      <text x="20" y="36" fill="#f5f7ff" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Remote</text>
      <text x="20" y="56" fill="#7f91b4" font-family="Segoe UI, Arial" font-size="12">Connected server</text>
      <rect x="20" y="72" width="498" height="34" rx="9" fill="#0d1729" stroke="#30436c"/>
      <rect x="20" y="120" width="116" height="32" rx="9" fill="url(#accent)"/>
      <text x="43" y="141" fill="white" font-family="Segoe UI, Arial" font-size="13" font-weight="700">Download</text>
      <rect x="20" y="167" width="498" height="1" fill="#2f4168"/>
      <text x="30" y="192" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">Name</text>
      <text x="300" y="192" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">Type</text>
      <text x="390" y="192" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">Size</text>
      <text x="445" y="192" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">Modified</text>
      <text x="30" y="220" fill="#edf2ff" font-family="Segoe UI, Arial" font-size="13">public_html</text>
      <text x="300" y="220" fill="#8ea1c5" font-family="Segoe UI, Arial" font-size="13">Folder</text>
    </g>

    <g transform="translate(286 414)">
      <rect width="1072" height="88" rx="20" fill="url(#panel)" stroke="#273a61"/>
      <text x="20" y="34" fill="#f5f7ff" font-family="Segoe UI, Arial" font-size="19" font-weight="700">Transfers</text>
      <text x="122" y="34" fill="#7f91b4" font-family="Segoe UI, Arial" font-size="12">1 active transfer</text>
      <rect x="20" y="52" width="1032" height="1" fill="#2f4168"/>
      <text x="30" y="75" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">app.zip</text>
      <rect x="260" y="65" width="210" height="10" rx="5" fill="#1b2945"/>
      <rect x="260" y="65" width="142" height="10" rx="5" fill="url(#accent)"/>
      <text x="484" y="75" fill="#9db0d4" font-family="Segoe UI, Arial" font-size="12">68% · 4.2 MB/s</text>
