    <text x="88" y="435" fill="white" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Connect selected</text>
    <text x="46" y="482" fill="#7384a6" font-family="Segoe UI, Arial" font-size="12">No telemetry · No tracking</text>

