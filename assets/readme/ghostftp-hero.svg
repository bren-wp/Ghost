  <g transform="translate(112 800)">
    <rect width="300" height="58" rx="18" fill="#0d1830" stroke="#2b4f8e"/>
    <text x="24" y="35" fill="#eaf0ff" font-family="Segoe UI, Arial" font-size="17" font-weight="700">C# only</text>
    <rect x="324" width="300" height="58" rx="18" fill="#0d1830" stroke="#2b4f8e"/>
    <text x="348" y="35" fill="#eaf0ff" font-family="Segoe UI, Arial" font-size="17" font-weight="700">No telemetry</text>
    <rect x="648" width="300" height="58" rx="18" fill="#0d1830" stroke="#6f4bd9"/>
    <text x="672" y="35" fill="#eaf0ff" font-family="Segoe UI, Arial" font-size="17" font-weight="700">Portable + Setup</text>
    <rect x="972" width="300" height="58" rx="18" fill="#0d1830" stroke="#2b4f8e"/>
    <text x="996" y="35" fill="#eaf0ff" font-family="Segoe UI, Arial" font-size="17" font-weight="700">FTP / FTPS</text>
  </g>
