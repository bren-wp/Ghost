      <rect x="22" y="69" width="580" height="28" rx="8" fill="#0d1729" stroke="#30436c"/>
      <rect x="614" y="69" width="80" height="28" rx="8" fill="#0d1729" stroke="#30436c"/>
      <rect x="706" y="69" width="174" height="28" rx="8" fill="#0d1729" stroke="#30436c"/>
      <rect x="892" y="63" width="158" height="38" rx="11" fill="url(#accent)"/>
      <text x="941" y="88" fill="white" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Connect</text>
